services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kgs
      POSTGRES_PASSWORD: kgs_dev
      POSTGRES_DB: kaizentrix_exam
    ports:
      - "5432:5432"
    volumes:
      - kgs_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgs -d kaizentrix_exam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  kgs_pg:
